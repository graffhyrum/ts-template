[test]
coverage = true
coverageThreshold = 1.0 # repo requires 100% per-file (see scripts/coverage-threshold.ts)
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/*.test.ts",
  "src/client.ts",
  "**/*.spec.ts",
  "scripts/**",
  "node_modules/**",
  "dist/**",
]

[fmt]
# printWidth = 100
# semi = false
